name: Issue Greeter Bot

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue || context.payload.pull_request;
            const isPR = !!context.payload.pull_request;
            const body = isPR
              ? `Thanks @${issue.user.login} for opening this PR! 🚀\nWe'll review it soon.`
              : `Thanks @${issue.user.login} for opening this issue! 🙌\nTeam will look into it soon.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });
