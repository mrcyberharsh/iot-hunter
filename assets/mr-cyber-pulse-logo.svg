<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">MR.CYBER PULSE Logo</title>
  <desc id="desc">A black and white ECG pulse inspired security brand mark with MR.CYBER PULSE text.</desc>
  <defs>
    <filter id="roughen" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="2" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="#f3f3f3"/>

  <g fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 260 H120 L145 260 L162 200 L182 285 L198 210 L214 330 L236 235 L255 260 L280 260 L300 260 L335 260 L343 210 L360 315 L378 240 L392 290 L410 260 L430 260 L455 260 L470 260 L490 260 L510 260 L520 260 L548 260 L565 320 L580 240 L595 300 L610 260 L642 260 L658 285 L678 240 L694 330 L712 200 L733 310 L748 260 L770 260 L805 260 L820 210 L836 298 L852 230 L870 255 L892 255 L910 255 L935 255 L955 255 L976 255 L993 312 L1010 235 L1027 330 L1046 265 L1068 260 L1106 260 H1170"/>
  </g>

  <g fill="#111111" filter="url(#roughen)">
    <text x="600" y="520" text-anchor="middle" font-size="148" font-weight="900" font-family="Impact, 'Arial Black', sans-serif" letter-spacing="-6">MR.CYBER PULSE</text>
    <text x="600" y="520" text-anchor="middle" font-size="148" font-weight="900" font-family="Impact, 'Arial Black', sans-serif" letter-spacing="-6" fill="none" stroke="#111111" stroke-width="2" opacity="0.36">MR.CYBER PULSE</text>
  </g>

  <rect width="1200" height="700" fill="#000" opacity="0.02" filter="url(#grain)"/>
</svg>




















































































































































































