# IoT Hunter v4.0 configuration (v3.1 engine settings retained)
database: ./data/iot.db
interface: auto
subnet: auto
wordlist_path: "modules/data/default_creds.txt"
oui_db_path: "modules/data/oui.txt"
thresholds:
  baseline_duration_sec: 60
  beacon_interval_variance: 0.15
  portscan_ports_per_min: 15
  exfil_bytes_per_min: 5000000
  window_sec: 60
credentials:
  max_attempts_per_service: 3
  timeout_sec: 3
report_path: "reports/"
inventory_history_path: "data/inventory-history.json"
log_path: "logs/iothunter.log"
scan:
  default_timeout: 3
  max_threads: 50
  default_ports: [21, 22, 23, 53, 80, 139, 443, 445, 8080, 8443]
alerts:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    user: ""
    password: ""
  webhook:
    enabled: false
    url: ""
api:
  rate_limit: 100
  token_ttl_hours: 24
