services:
  iot-hunter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: iot-hunter
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      IOT_HUNTER_DATA: /app/data
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  redis-data: